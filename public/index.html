<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silent Auction — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="display">
  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <div class="eyebrow"><span class="live-dot" id="liveDot"></span><span id="liveLabel">Live silent auction</span></div>
        <h1 id="title">Silent Auction</h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="clock" id="clock">
        <div class="clock-label" id="clockLabel">Bidding closes in</div>
        <div class="clock-digits" id="clockDigits">--:--:--</div>
        <div class="clock-sub" id="clockSub"></div>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <main class="body">
      <section class="stage">
        <div class="stage-head">
          <h2 id="stageTitle">Auction items</h2>
          <div class="pager" id="pager"></div>
        </div>
        <div class="stage-view" id="stageView"></div>
      </section>
      <aside class="side">
        <div class="panel">
          <h3>Latest bids</h3>
          <ol class="feed" id="feed"></ol>
        </div>
        <div class="panel">
          <h3>Most wanted</h3>
          <ol class="wanted" id="wanted"></ol>
        </div>
        <div class="panel gb-panel" id="gbPanel" hidden>
          <h3>Givebutter campaign</h3>
          <div id="gbBody"></div>
        </div>
      </aside>
    </main>

    <footer class="foot">
      <div id="bidUrl" class="bid-url"></div>
      <div class="foot-right">
        <div class="updated" id="updated">Connecting…</div>
        <button class="fs-btn" id="fsBtn" title="Full screen (F)">⤢ Full screen</button>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="closed-banner" id="closedBanner" hidden></div>

  <script src="/display.js"></script>
</body>
</html>
